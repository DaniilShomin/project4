datebases:
  - name: db
    postgresMajorVersion: 14
    plan: free
    envVars:
      - key: DATABASE_NAME
        value: postgres
      - key: DATABASE_USERNAME
        value: postgres
      - key: DATABASE_PASSWORD
        value: postgres
      - key: PORT
        value: 5432
    # disks:
    #   - name: postgres_data
    #     mountPath: /var/lib/postgresql/data/
services:
  - type: web
    name: backend
    autoDeploy: true
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_HOST
        value: db
      - key: DATABASE_NAME
        value: postgres
      - key: DATABASE_USERNAME
        value: postgres
      - key: DATABASE_PASSWORD
        value: postgres
      - key: PORT
        value: 8000
    buildFilter:
      paths:
        - ./backend/**
  - type: web
    name: frontend
    autoDeploy: true
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    buildFilter:
      paths:
        - ./frontend/**
    envVars:
      - key: PORT
        value: 5173
